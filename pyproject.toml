[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-gif-generator-studio"
version = "0.6.2"
description = "AI GIF generator studio — text-to-GIF and image-to-GIF with temporal coherence sampling."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ai-gif-studio contributors" }]
keywords = ["gif", "diffusion", "animation", "ai", "text-to-gif"]

dependencies = [
    "torch>=2.3",
    "diffusers>=0.30",
    "transformers>=4.42",
    "accelerate>=0.33",
    "safetensors>=0.4",
    "Pillow>=10.3",
    "numpy>=1.26",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "PySide6>=6.7",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-qt>=4.4", "ruff>=0.5", "mypy>=1.10"]
cuda = ["xformers>=0.0.27"]

[project.scripts]
ai-gif-studio = "ai_gif_studio.app:main"

[tool.setuptools.packages.find]
include = ["ai_gif_studio*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"